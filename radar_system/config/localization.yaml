amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /mapping/scan
    tf_broadcast: true
    transform_tolerance: 0.5
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 1500
    max_beams: 60
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2
    set_initial_pose: false
    always_reset_initial_pose: true
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
